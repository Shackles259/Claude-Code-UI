name: Release

# Produces three self-contained packages (macOS / Windows / Linux) on tag push
# or manual dispatch. Each package bundles a portable Node runtime + the
# compiled server (with platform-specific native modules) + the frontend build,
# so end users need nothing preinstalled except the Claude CLI itself.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (e.g. v0.1.0)'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon (arm64)
            platform: macos
            archive: tar.gz
            asset_name: ClaudeUI-macos-arm64
          - os: ubuntu-22.04    # older glibc for broad Linux compatibility
            platform: linux
            archive: tar.gz
            asset_name: ClaudeUI-linux-x64
          - os: windows-latest
            platform: windows
            archive: zip
            asset_name: ClaudeUI-windows-x64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend & backend
        run: npm run build

      # ---- Determine portable Node runtime to bundle ----
      - name: Determine Node runtime archive
        id: node_archive
        shell: bash
        run: |
          VERSION="v20.18.1"
          case "${{ matrix.platform }}" in
            macos)   ARCH="darwin-arm64" ;;
            linux)   ARCH="linux-x64" ;;
            windows) ARCH="win-x64" ;;
          esac
          if [ "${{ matrix.platform }}" = "windows" ]; then
            echo "url=https://nodejs.org/dist/${VERSION}/node-${VERSION}-${ARCH}.zip" >> $GITHUB_OUTPUT
            echo "ext=zip" >> $GITHUB_OUTPUT
          else
            echo "url=https://nodejs.org/dist/${VERSION}/node-${VERSION}-${ARCH}.tar.gz" >> $GITHUB_OUTPUT
            echo "ext=tar.gz" >> $GITHUB_OUTPUT
          fi
          echo "dirname=node-${VERSION}-${ARCH}" >> $GITHUB_OUTPUT

      - name: Download portable Node runtime
        shell: bash
        run: |
          mkdir -p build/noderoot
          cd build/noderoot
          if [ "${{ steps.node_archive.outputs.ext }}" = "zip" ]; then
            curl -L "${{ steps.node_archive.outputs.url }}" -o node.zip
            unzip -q node.zip
            # Flatten: move archive contents up.
            mv ${{ steps.node_archive.outputs.dirname }}/* .
          else
            curl -L "${{ steps.node_archive.outputs.url }}" | tar xz --strip-components=1
          fi
          # Sanity check.
          ls bin/node 2>/dev/null || ls node.exe 2>/dev/null || { echo "Node binary not found after extract"; exit 1; }

      # ---- Install backend runtime deps into the package dir ----
      # We install production-only directly into the staged package, so the
      # final node_modules contains exactly the runtime deps (with the correct
      # platform native modules like better-sqlite3), nothing else.
      - name: Stage package skeleton
        shell: bash
        run: |
          ROOT="build/${{ matrix.asset_name }}"
          mkdir -p "$ROOT/server" "$ROOT/web" "$ROOT/node/bin"
          cp -R backend/dist "$ROOT/server/dist"
          cp backend/package.json "$ROOT/server/package.json"
          cp -R frontend/dist "$ROOT/web/dist"
          cp packaging/README.txt "$ROOT/README.txt"

      - name: Install backend runtime deps (unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          ROOT="build/${{ matrix.asset_name }}"
          cd "$ROOT/server"
          npm install --omit=dev --no-audit --no-fund
          # Place portable node binary into node/bin.
          cp -R ../../noderoot/bin/* "$ROOT/node/bin/"
          cp ../../noderoot/LICENSE "$ROOT/node/" 2>/dev/null || true
          # Launcher script.
          cp ../../../scripts/start.sh "$ROOT/start"
          chmod +x "$ROOT/start"

      - name: Install backend runtime deps (windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          ROOT="build/${{ matrix.asset_name }}"
          cd "$ROOT/server"
          npm install --omit=dev --no-audit --no-fund
          # Place portable node binary (node.exe) into node/.
          cp ../../noderoot/node.exe "$ROOT/node/node.exe" 2>/dev/null || cp ../../noderoot/*.exe "$ROOT/node/"
          cp ../../../scripts/start.bat "$ROOT/start.bat"

      # ---- Sanity check the staged server can boot ----
      - name: Smoke test server boots
        shell: bash
        env:
          CLAUDE_UI_ROOT: build/${{ matrix.asset_name }}
          PORT: '3999'
        run: |
          ROOT="build/${{ matrix.asset_name }}"
          SERVER="$ROOT/server/dist/server.js"
          # Use the system node here (CI), not the bundled one.
          node "$SERVER" > /tmp/smoke.log 2>&1 &
          SVPID=$!
          sleep 6
          if curl -s http://localhost:3999/api/health | grep -q '"ok":true'; then
            echo "Server smoke test PASSED"
          else
            echo "Server smoke test FAILED"; cat /tmp/smoke.log; exit 1
          fi
          kill $SVPID 2>/dev/null || true

      # ---- Archive ----
      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd build
          tar czf "../${{ matrix.asset_name }}.tar.gz" "${{ matrix.asset_name }}"

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          cd build
          7z a "../${{ matrix.asset_name }}.zip" "${{ matrix.asset_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.zip

  release:
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.version != ''
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Claude Code WebUI ${{ github.event.inputs.version || github.ref_name }}
          body: |
            ## 使用方法
            1. 下载对应平台的压缩包
            2. 解压到任意目录
            3. macOS/Linux 运行 `./start`；Windows 双击 `start.bat`
            4. 浏览器自动打开 http://localhost:3000

            ## 前置要求
            - 需已安装 Claude Code CLI 并完成登录（`claude` 命令可用）
            - macOS 首次运行若提示无法验证开发者，在终端执行：
              `xattr -d com.apple.quarantine /path/to/start`
          files: artifacts/*
          draft: false
          prerelease: false
