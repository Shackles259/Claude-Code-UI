name: Release

# Produces three self-contained packages (macOS / Windows / Linux) on tag push
# or manual dispatch. Each package bundles a portable Node runtime + the
# compiled server (with platform-specific native modules compiled against the
# BUNDLED node, so ABI matches at runtime) + the frontend build.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (e.g. v0.1.0)'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon (arm64)
            platform: macos
            archive: tar.gz
            asset_name: ClaudeUI-macos-arm64
          - os: ubuntu-22.04    # older glibc for broad Linux compatibility
            platform: linux
            archive: tar.gz
            asset_name: ClaudeUI-linux-x64
          - os: windows-latest
            platform: windows
            archive: zip
            asset_name: ClaudeUI-windows-x64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Use a system node just for the initial build (vite/tsc). The bundled
      # runtime is downloaded separately below and used to compile native addons
      # so their ABI matches what ships in the package.
      - name: Setup Node.js 20 (build only)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (root workspaces)
        run: npm ci

      - name: Build frontend & backend
        run: npm run build

      # ---- Download the portable Node runtime that will ship in the package ----
      - name: Determine Node runtime archive
        id: node_archive
        shell: bash
        run: |
          VERSION="v20.18.1"
          case "${{ matrix.platform }}" in
            macos)   ARCH="darwin-arm64" ;;
            linux)   ARCH="linux-x64" ;;
            windows) ARCH="win-x64" ;;
          esac
          if [ "${{ matrix.platform }}" = "windows" ]; then
            echo "url=https://nodejs.org/dist/${VERSION}/node-${VERSION}-${ARCH}.zip" >> $GITHUB_OUTPUT
            echo "ext=zip" >> $GITHUB_OUTPUT
          else
            echo "url=https://nodejs.org/dist/${VERSION}/node-${VERSION}-${ARCH}.tar.gz" >> $GITHUB_OUTPUT
            echo "ext=tar.gz" >> $GITHUB_OUTPUT
          fi
          echo "dirname=node-${VERSION}-${ARCH}" >> $GITHUB_OUTPUT

      - name: Download portable Node runtime (unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          ROOT="$GITHUB_WORKSPACE/build/${{ matrix.asset_name }}"
          mkdir -p "$ROOT/node/bin"
          curl -L "${{ steps.node_archive.outputs.url }}" | tar xz --strip-components=1 -C "$ROOT/node/bin"
          test -f "$ROOT/node/bin/bin/node" || { echo "node binary missing"; exit 1; }
          "$ROOT/node/bin/bin/node" --version

      - name: Download portable Node runtime (windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          ROOT="$GITHUB_WORKSPACE/build/${{ matrix.asset_name }}"
          mkdir -p "$ROOT/node"
          curl -L "${{ steps.node_archive.outputs.url }}" -o /tmp/node.zip
          unzip -q /tmp/node.zip -d /tmp/node-extract
          # Copy the ENTIRE node directory (node.exe + node_modules with npm),
          # so the bundled npm CLI is available for native module compilation.
          cp -R /tmp/node-extract/${{ steps.node_archive.outputs.dirname }}/* "$ROOT/node/"
          test -f "$ROOT/node/node.exe" || { echo "node.exe missing"; exit 1; }
          "$ROOT/node/node.exe" --version

      # ---- Stage the package skeleton ----
      - name: Stage package skeleton
        shell: bash
        run: |
          ROOT="$GITHUB_WORKSPACE/build/${{ matrix.asset_name }}"
          mkdir -p "$ROOT/server" "$ROOT/web"
          cp -R backend/dist "$ROOT/server/dist"
          cp backend/package.json "$ROOT/server/package.json"
          cp -R frontend/dist "$ROOT/web/dist"
          cp packaging/README.txt "$ROOT/README.txt"

      # ---- Install backend runtime deps, compiling native addons against the
      #      BUNDLED node so the ABI matches at runtime (critical for better-sqlite3).
      - name: Install backend runtime deps (unix, against bundled node)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          ROOT="$GITHUB_WORKSPACE/build/${{ matrix.asset_name }}"
          BUNDLED_NODE="$ROOT/node/bin/bin/node"
          # Use the npm CLI that ships inside the bundled node runtime, so the
          # build node and the install/rebuild node are guaranteed identical.
          BUNDLED_NPM="$ROOT/node/bin/lib/node_modules/npm/bin/npm-cli.js"
          test -f "$BUNDLED_NPM" || { echo "bundled npm-cli.js not found"; find "$ROOT/node/bin" -name 'npm-cli.js' | head; exit 1; }
          export PATH="$(dirname "$BUNDLED_NODE"):$PATH"
          cd "$ROOT/server"
          "$BUNDLED_NODE" "$BUNDLED_NPM" install --omit=dev --no-audit --no-fund
          "$BUNDLED_NODE" "$BUNDLED_NPM" rebuild better-sqlite3
          echo "Installed $(ls node_modules | wc -l) packages"

      - name: Install backend runtime deps (windows, against bundled node)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          ROOT="$GITHUB_WORKSPACE/build/${{ matrix.asset_name }}"
          BUNDLED_NODE="$ROOT/node/node.exe"
          # The bundled node ships its own npm CLI at node_modules/npm/bin/npm-cli.js
          BUNDLED_NPM="$ROOT/node/node_modules/npm/bin/npm-cli.js"
          test -f "$BUNDLED_NPM" || { echo "bundled npm-cli.js not found"; ls "$ROOT/node"; exit 1; }
          export PATH="$(dirname "$BUNDLED_NODE"):$PATH"
          cd "$ROOT/server"
          "$BUNDLED_NODE" "$BUNDLED_NPM" install --omit=dev --no-audit --no-fund
          "$BUNDLED_NODE" "$BUNDLED_NPM" rebuild better-sqlite3
          echo "Installed $(ls node_modules | wc -l) packages"

      # ---- Add launcher scripts ----
      - name: Add launcher scripts (unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          ROOT="$GITHUB_WORKSPACE/build/${{ matrix.asset_name }}"
          cp "$GITHUB_WORKSPACE/scripts/start.sh" "$ROOT/start"
          chmod +x "$ROOT/start"

      - name: Add launcher scripts (windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          ROOT="$GITHUB_WORKSPACE/build/${{ matrix.asset_name }}"
          cp "$GITHUB_WORKSPACE/scripts/start.bat" "$ROOT/start.bat"

      # ---- Smoke test: boot the staged server WITH THE BUNDLED NODE so we
      #      actually verify the native module loads at runtime.
      - name: Smoke test server boots (unix, bundled node)
        if: matrix.platform != 'windows'
        shell: bash
        env:
          CLAUDE_UI_ROOT: ${{ github.workspace }}/build/${{ matrix.asset_name }}
          PORT: '3999'
        run: |
          ROOT="$GITHUB_WORKSPACE/build/${{ matrix.asset_name }}"
          "$ROOT/node/bin/bin/node" "$ROOT/server/dist/server.js" > /tmp/smoke.log 2>&1 &
          SVPID=$!
          sleep 8
          if curl -s http://localhost:3999/api/health | grep -q '"ok":true'; then
            echo "Smoke test PASSED (bundled node boots server + native module)"
          else
            echo "Smoke test FAILED — log:"; cat /tmp/smoke.log; exit 1
          fi
          kill $SVPID 2>/dev/null || true

      - name: Smoke test server boots (windows, bundled node)
        if: matrix.platform == 'windows'
        shell: bash
        env:
          CLAUDE_UI_ROOT: ${{ github.workspace }}/build/${{ matrix.asset_name }}
          PORT: '3999'
        run: |
          ROOT="$GITHUB_WORKSPACE/build/${{ matrix.asset_name }}"
          "$ROOT/node/node.exe" "$ROOT/server/dist/server.js" > /tmp/smoke.log 2>&1 &
          SVPID=$!
          sleep 10
          if curl -s http://localhost:3999/api/health | grep -q '"ok":true'; then
            echo "Smoke test PASSED"
          else
            echo "Smoke test FAILED — log:"; cat /tmp/smoke.log; exit 1
          fi
          kill $SVPID 2>/dev/null || true

      # ---- Archive ----
      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/build"
          tar czf "$GITHUB_WORKSPACE/${{ matrix.asset_name }}.tar.gz" "${{ matrix.asset_name }}"

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/build"
          7z a "$GITHUB_WORKSPACE/${{ matrix.asset_name }}.zip" "${{ matrix.asset_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.zip

  release:
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.version != ''
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Claude Code WebUI ${{ github.event.inputs.version || github.ref_name }}
          body: |
            ## 使用方法
            1. 下载对应平台的压缩包
            2. 解压到任意目录
            3. macOS/Linux 运行 `./start`；Windows 双击 `start.bat`
            4. 浏览器自动打开 http://localhost:3000

            ## 前置要求
            - 需已安装 Claude Code CLI 并完成登录（`claude` 命令可用）
            - macOS 首次运行若提示无法验证开发者，在终端执行：
              `xattr -d com.apple.quarantine /path/to/start`
          files: artifacts/*
          draft: false
          prerelease: false
